<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вопрос {{ number }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <div class="progress-text">Вопрос {{ number }} из {{ total }}</div>
    <div class="progress">
      <div class="progress-fill"
           style="width: {{ number * 100 / total }}%; --from: {{ (number - 1) * 100 / total }}%"></div>
    </div>

    <h2 class="question">{{ q.text }}</h2>

    <form method="POST">
      {% for a in q.answers %}
        <button class="answer" type="submit" name="answer" value="{{ loop.index0 }}"
                style="animation-delay: {{ loop.index0 * 0.08 }}s">
          {{ a.text }}
        </button>
      {% endfor %}
    </form>
  </main>
</body>
</html>
