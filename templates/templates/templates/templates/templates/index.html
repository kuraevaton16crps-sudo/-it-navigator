<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вопрос {{ number }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <p>Вопрос {{ number }} из {{ total }}</p>
  <h2>{{ q.text }}</h2>

  <form method="POST">
    {% for a in q.answers %}
      <button class="answer" type="submit" name="answer" value="{{ loop.index0 }}">
        {{ a.text }}
      </button>
    {% endfor %}
  </form>
</body>
</html>
